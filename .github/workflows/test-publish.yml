name: Publish to TestPyPI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-testpypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build test distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.19"
          python-version: "3.13"
          enable-cache: true
      - name: Build and validate distributions
        run: |
          uv build --no-sources
          uvx --from twine twine check dist/*
          uv run --no-project python scripts/check_distribution.py dist/*
      - name: Upload checked distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish checked distributions
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: testpypi
      url: https://test.pypi.org/project/extended-einsum/
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download checked distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-distributions
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: false
