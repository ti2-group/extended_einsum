name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.19"
          enable-cache: true
      - name: Run Ruff
        run: uv run --frozen --only-group dev ruff check .

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.19"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install CPU test environment
        run: uv sync --frozen --group dev --extra jax --extra visualization
      - name: Run tests
        env:
          JAX_PLATFORMS: cpu
          MPLBACKEND: Agg
        run: |
          uv run --frozen pytest \
            --ignore=tests/test_cirkit_demo.py \
            --ignore=tests/test_cirkit_benchmark_plots.py

  cirkit:
    name: Cirkit demo smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.19"
          python-version: "3.13"
          enable-cache: true
      - name: Install demo environment
        run: uv sync --frozen --group dev --group demo
      - name: Run small synthetic integration tests
        env:
          MPLBACKEND: Agg
        run: |
          uv run --frozen pytest -q \
            tests/test_cirkit_demo.py \
            tests/test_cirkit_benchmark_plots.py \
            tests/test_monarch_experiment.py \
            tests/test_monarch_imagenet64.py

  package:
    name: Build and inspect distributions
    runs-on: ubuntu-latest
    needs: [lint, test, cirkit]
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.19"
          python-version: "3.13"
          enable-cache: true
      - name: Build wheel and source distribution
        run: uv build --no-sources
      - name: Validate metadata and archive contents
        run: |
          uvx --from twine twine check dist/*
          uv run --no-project python scripts/check_distribution.py dist/*
      - name: Smoke-test installed wheel outside checkout
        run: |
          uv venv /tmp/extended-einsum-smoke --python 3.13
          uv pip install --python /tmp/extended-einsum-smoke/bin/python dist/*.whl
          cd /tmp
          /tmp/extended-einsum-smoke/bin/python "$GITHUB_WORKSPACE/examples/torch_quickstart.py"
          /tmp/extended-einsum-smoke/bin/python "$GITHUB_WORKSPACE/examples/numpy_backend.py"
          /tmp/extended-einsum-smoke/bin/python "$GITHUB_WORKSPACE/examples/stable_materialization.py"
          /tmp/extended-einsum-smoke/bin/python -c "import importlib.util; assert importlib.util.find_spec('jax') is None"
      - name: Upload checked distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
